            justify-content: space-between;
            align-items: center;

            border-bottom: 2px solid #00f0ff;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);

        #lyrics-container {
            flex: 1;
            padding-right: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lyrics-content {

            font-weight: 900;
            letter-spacing: 2px;

            top: 54%;
            left: 50%;
            transform: translateX(-50%);

            pointer-events: none;

            0% { opacity: 0; transform: scale(0.8) translateY(10px); }

    hit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(320, now);

        osc.start(now);

        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
    }
};

   ================================================================= */
const pCanvas = document.getElementById('player-canvas');
const pCtx = pCanvas.getContext('2d');
const rCanvas = document.getElementById('rival-canvas');

let pW, pH, rW, rH, laneWidth;
const LANES = 4;

function resizeAll() {
    pW = document.getElementById('player-section').clientWidth;
    pH = document.getElementById('player-section').clientHeight;
    pCanvas.width = pW;
    pCanvas.height = pH;

    rW = document.getElementById('rival-section').clientWidth;

}
window.addEventListener('resize', resizeAll);
resizeAll();

let gameState = 'LOBBY';
let playerScore = 0;
let playerCombo = 0;
let rivalScore = 0;
let rivalCombo = 0;
let playerNotes = [];
let rivalNotes = [];
let activeTouches = new Set();
let playerSpeed = 500;
let rivalSpeed = 380;
let gameStartTimestamp = 0;

/* =================================================================
   6. GESTIÓN DEL CHAT EN 2 FASES (1 Toque: Rápido / 2 Toques: Texto)
   ================================================================= */
const chatToggleBtn = document.getElementById('chat-toggle-btn');
const chatPhase1 = document.getElementById('chat-phase1');
const chatPhase2 = document.getElementById('chat-phase2');
const chatInputField = document.getElementById('chat-input-field');
const chatSendBtn = document.getElementById('chat-send-btn');
const btnOpenKeyboard = document.getElementById('btn-open-keyboard');
const chatBubbleContainer = document.getElementById('chat-bubble-container');

let lastChatTap = 0;

function closeAllChatDrawers() {
    chatPhase1.classList.add('hidden');
    chatPhase2.classList.add('hidden');
}

// Detección de 1 toque vs 2 toques sobre el botón de chat
chatToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const now = Date.now();
    const delta = now - lastChatTap;
    lastChatTap = now;

    if (delta < 300) {
        // Doble toque -> Fase 2 (Teclado)
        chatPhase1.classList.add('hidden');
        chatPhase2.classList.toggle('hidden');
        if (!chatPhase2.classList.contains('hidden')) {
            chatInputField.focus();
        }
    } else {
        // Toque simple -> Fase 1 (Respuestas rápidas)
        chatPhase2.classList.add('hidden');
        chatPhase1.classList.toggle('hidden');
    }
});

btnOpenKeyboard.addEventListener('click', (e) => {
    e.stopPropagation();
    chatPhase1.classList.add('hidden');
    chatPhase2.classList.remove('hidden');
    chatInputField.focus();
});

// Enviar mensaje
function sendChat(text) {
    if (!chatRef || !text || !text.trim()) return;
    chatRef.push({
        sender: localPlayer,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });
    closeAllChatDrawers();
}

document.querySelectorAll('.quick-btn[data-msg]').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        sendChat(btn.getAttribute('data-msg'));
    });
});

chatSendBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (chatInputField.value) {
        sendChat(chatInputField.value);
        chatInputField.value = '';
    }
});

chatInputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        chatSendBtn.click();
    }
});

// Cerrar chat al tocar la pantalla fuera
document.addEventListener('click', (e) => {
    if (!e.target.closest('#chat-phase1') && !e.target.closest('#chat-phase2') && !e.target.closest('#chat-toggle-btn')) {
        closeAllChatDrawers();
    }
});

function displayBubble(sender, text) {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${sender === 'Daniela' ? 'bubble-daniela' : 'bubble-sam'}`;
    bubble.innerHTML = `<span style="font-size:0.75rem; opacity:0.8;">[${sender}]</span> <span>${text}</span>`;
    chatBubbleContainer.appendChild(bubble);

    setTimeout(() => {
        bubble.style.transition = 'all 0.3s ease';
        bubble.style.opacity = '0';
        bubble.style.transform = 'translateY(-10px)';
        setTimeout(() => bubble.remove(), 300);
    }, 2800);
}

/* =================================================================
   7. LOBBY ROBUSTO CON CONTRASEÑA Y SINCRONIZACIÓN DE 2 JUGADORES
   ================================================================= */
document.getElementById('btn-select-daniela').addEventListener('click', () => pickPlayer('Daniela'));
document.getElementById('btn-select-sam').addEventListener('click', () => pickPlayer('Sam'));

function pickPlayer(name) {
    SFX.init();
    localPlayer = name;
    rivalPlayer = (name === 'Daniela') ? 'Sam' : 'Daniela';

    document.getElementById('screen-character').classList.add('hidden');
    document.getElementById('screen-room').classList.remove('hidden');
    document.getElementById('player-name-badge').innerText = `TÚ (${localPlayer.toUpperCase()})`;
    document.getElementById('rival-name-badge').innerText = `RIVAL: ${rivalPlayer.toUpperCase()}`;
}

document.getElementById('btn-join-room').addEventListener('click', () => {
    const pass = document.getElementById('room-pass').value.trim() || '1234';
    roomCode = pass.replace(/[^a-zA-Z0-9_-]/g, '');

    document.getElementById('btn-join-room').classList.add('hidden');
    document.getElementById('room-status-box').classList.remove('hidden');

    currentRoomRef = db.ref(`rooms/room_${roomCode}`);
    chatRef = currentRoomRef.child('chat');

    // Escuchar mensajes en la sala
    chatRef.limitToLast(5).on('child_added', (snap) => {
        const msg = snap.val();
        if (msg) displayBubble(msg.sender, msg.text);
    });

    // Registrar jugador
    const playerRef = currentRoomRef.child(`players/${localPlayer}`);
    playerRef.set({
        ready: true,
        score: 0,
        combo: 0,
        attackTrigger: 0
    });
    playerRef.onDisconnect().remove();

    // Escuchar estado de ambos jugadores
    currentRoomRef.child('players').on('value', (snap) => {
        const players = snap.val() || {};
        const danielaReady = players.Daniela && players.Daniela.ready;
        const samReady = players.Sam && players.Sam.ready;

        document.getElementById('status-daniela').innerText = `Daniela: ${danielaReady ? '¡Conectada! ✅' : 'Esperando... ⏳'}`;
        document.getElementById('status-daniela').style.color = danielaReady ? '#00f5d4' : '#b09dc8';

        document.getElementById('status-sam').innerText = `Sam: ${samReady ? '¡Conectado! ✅' : 'Esperando... ⏳'}`;
        document.getElementById('status-sam').style.color = samReady ? '#00f5d4' : '#b09dc8';

        // Solo iniciar si AMBOS están conectados y listos
        if (danielaReady && samReady && gameState === 'LOBBY') {
            if (localPlayer === 'Daniela') {
                // Daniela fija el timestamp sincronizado para ambos
                const startTimestamp = Date.now() + 3500;
                currentRoomRef.update({ startTime: startTimestamp });
            }
        }

        // Datos del rival en partida
        if (players[rivalPlayer]) {
            rivalScore = players[rivalPlayer].score || 0;
            rivalCombo = players[rivalPlayer].combo || 0;
            document.getElementById('rival-score-text').innerText = `SCORE: ${rivalScore}`;
            document.getElementById('rival-combo-text').innerText = `COMBO x${rivalCombo}`;

            const attackTime = players[rivalPlayer].attackTrigger || 0;
            if (attackTime > (window.lastReceivedAttack || 0)) {
                window.lastReceivedAttack = attackTime;
                triggerHeartDistraction();
            }
        }
    });

    // Escuchar el inicio sincronizado
    currentRoomRef.child('startTime').on('value', (snap) => {
        const time = snap.val();
        if (time && gameState === 'LOBBY') {
            gameStartTimestamp = time;
            handleCountdownAndStart();
        }
    });
});

function handleCountdownAndStart() {
    const cdText = document.getElementById('countdown-text');
    const interval = setInterval(() => {
        const remaining = gameStartTimestamp - Date.now();
        if (remaining <= 0) {
            clearInterval(interval);
            cdText.innerText = "¡INICIANDO!";
            launchMatch();
        } else {
            cdText.innerText = `¡Ambos listos! Comenzando en ${(remaining / 1000).toFixed(1)}s...`;
        }
    }, 50);
}

function launchMatch() {
    gameState = 'PLAYING';
    document.getElementById('screen-room').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');

    playerScore = 0;
    playerCombo = 0;
    playerSpeed = pH * 0.75;
    rivalSpeed = rH * 0.75;

    playerNotes = TRACK_CHART.map((n, i) => ({
        id: i,
        lane: n.lane,
        targetTime: n.time,
        durationSec: n.dur,
        isHold: n.dur > 0.4,
        holding: false,
        holdProgress: 0,
        hit: false,
        missed: false
    }));

    rivalNotes = TRACK_CHART.map((n, i) => ({
        id: i,
        lane: n.lane,
        targetTime: n.time,
        durationSec: n.dur,
        isHold: n.dur > 0.4,
        hit: false
    }));

    audioEl.currentTime = 0;
    audioEl.play().catch(() => {});

    requestAnimationFrame(gameLoop);
}

/* =================================================================
   8. EFECTO DISTRACCIÓN CON CORAZONES (COMBO 15)
   ================================================================= */
function triggerHeartDistraction() {
    const overlay = document.getElementById('heart-attack-overlay');
    overlay.style.opacity = '1';
    overlay.innerHTML = '';

    const hearts = ['💖', '💕', '💗', '💓', '💘'];
    for (let i = 0; i < 16; i++) {
        const span = document.createElement('span');
        span.className = 'floating-heart';
        span.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        span.style.left = Math.random() * 85 + 5 + '%';
        span.style.top = Math.random() * 70 + 20 + '%';
        span.style.animationDelay = (Math.random() * 0.5) + 's';
        overlay.appendChild(span);
    }

    setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.innerHTML = ''; }, 300);
    }, 1500);
}

function sendCombo15Attack() {
    if (currentRoomRef) {
        currentRoomRef.child(`players/${localPlayer}`).update({
            attackTrigger: Date.now()
        });
    }
}

function syncPlayerStats() {
    if (currentRoomRef) {
        currentRoomRef.child(`players/${localPlayer}`).update({
            score: playerScore,
            combo: playerCombo
        });
    }
}

/* =================================================================
   9. CONTROLES Y TOQUES LOCALES
   ================================================================= */
function onLaneDown(lane) {
    if (gameState !== 'PLAYING') return;
    const now = audioEl.currentTime;
    const hitTolerance = 0.18;

    let target = null;
    let minDelta = Infinity;

    for (let i = 0; i < playerNotes.length; i++) {
        let n = playerNotes[i];
        if (n.lane === lane && !n.hit && !n.missed) {
            let delta = Math.abs(n.targetTime - now);
            if (delta < minDelta) {
                minDelta = delta;
                target = n;
            }
        }
    }

    if (target && minDelta < hitTolerance) {
        if (!target.isHold) {
            target.hit = true;
            SFX.hit();
            playerScore += 100;
            playerCombo++;

            if (playerCombo > 0 && playerCombo % 15 === 0) {
                sendCombo15Attack();
            }

            triggerFeedback('PERFECT!', '#00f0ff');
            updateLocalHUD();
            syncPlayerStats();
        } else {
            target.holding = true;
            SFX.hit();
            triggerFeedback('HOLD!', '#ff416c');
        }
        return;
    }

    SFX.miss();
    playerCombo = 0;
    playerScore = Math.max(0, playerScore - 25);
    triggerFeedback('MISS', '#ff2a55');
    updateLocalHUD();
    syncPlayerStats();
}

function onLaneUp(lane) {
    for (let i = 0; i < playerNotes.length; i++) {
        let n = playerNotes[i];
        if (n.lane === lane && n.holding && !n.hit) {
            n.holding = false;
            if (n.holdProgress < 0.7) {
                n.missed = true;
                playerCombo = 0;
                triggerFeedback('SOLTADO!', '#ff2a55');
                SFX.miss();
            } else {
                n.hit = true;
                playerScore += 160;
                playerCombo++;
                if (playerCombo > 0 && playerCombo % 15 === 0) {
                    sendCombo15Attack();
                }
                triggerFeedback('GREAT!', '#f9d423');
            }
            updateLocalHUD();
            syncPlayerStats();
            break;
        }
    }
}

function updateLocalHUD() {
    document.getElementById('player-score-text').innerText = playerScore;
    document.getElementById('player-combo-text').innerText = `COMBO x${playerCombo}`;
}

function triggerFeedback(txt, color) {
    const fb = document.getElementById('feedback-text');
    fb.innerText = txt;
    fb.style.color = color;
    fb.style.opacity = '1';
    setTimeout(() => fb.style.opacity = '0', 200);
}

/* =================================================================
   10. BUCLE DE JUEGO
   ================================================================= */
function gameLoop() {
    if (gameState !== 'PLAYING') return;

    const now = audioEl.currentTime;

    // Subtítulos
    const lyric = LYRICS.find(l => now >= l.start && now <= l.end);
    const lyricEl = document.getElementById('lyrics-content');
    if (lyric) {
        lyricEl.innerText = lyric.text;
        lyricEl.className = lyric.isChorus ? 'lyric-chorus' : '';
    }

    // Render Rival
    rCtx.fillStyle = '#0a0515';
    rCtx.fillRect(0, 0, rW, rH);

    rCtx.strokeStyle = 'rgba(255, 65, 108, 0.12)';
    for (let i = 1; i < LANES; i++) {
        rCtx.beginPath();
        rCtx.moveTo(i * (rW / LANES), 0);
        rCtx.lineTo(i * (rW / LANES), rH);
        rCtx.stroke();
    }

    const rTargetY = rH * 0.82;
    rCtx.strokeStyle = '#ff416c';
    rCtx.lineWidth = 1.5;
    rCtx.beginPath();
    rCtx.moveTo(0, rTargetY);
    rCtx.lineTo(rW, rTargetY);
    rCtx.stroke();

    for (let i = 0; i < rivalNotes.length; i++) {
        let n = rivalNotes[i];
        const diff = n.targetTime - now;
        const headY = rTargetY - (diff * rivalSpeed) - 10;

        if (headY > -20 && headY < rH + 20) {
            const laneX = n.lane * (rW / LANES) + 3;
            const w = (rW / LANES) - 6;
            rCtx.fillStyle = '#ff416c';
            rCtx.beginPath();
            rCtx.roundRect(laneX, headY, w, 10, 4);
            rCtx.fill();
        }
    }

    // Render Jugador Local
    pCtx.fillStyle = '#06030c';
    pCtx.fillRect(0, 0, pW, pH);

    pCtx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
    for (let i = 1; i < LANES; i++) {
        pCtx.beginPath();
        pCtx.moveTo(i * laneWidth, 0);
        pCtx.lineTo(i * laneWidth, pH);
        pCtx.stroke();
    }

    const pTargetY = pH * 0.82;
    pCtx.strokeStyle = '#00f0ff';
    pCtx.lineWidth = 2.5;
    pCtx.beginPath();
    pCtx.moveTo(0, pTargetY);
    pCtx.lineTo(pW, pTargetY);
    pCtx.stroke();

    activeTouches.forEach(lane => {
        pCtx.fillStyle = 'rgba(0, 240, 255, 0.18)';
        pCtx.fillRect(lane * laneWidth, 0, laneWidth, pH);
    });

    const tileH = pH * 0.11;

    for (let i = 0; i < playerNotes.length; i++) {
        let n = playerNotes[i];

        if (n.holding && !n.hit) {
            n.holdProgress = Math.min(1.0, (now - n.targetTime) / n.durationSec);
            playerScore += 1;
            document.getElementById('player-score-text').innerText = playerScore;

            if (n.holdProgress >= 1.0) {
                n.holding = false;
                n.hit = true;
                playerScore += 160;
                playerCombo++;
                if (playerCombo > 0 && playerCombo % 15 === 0) sendCombo15Attack();
                triggerFeedback('PERFECT HOLD!', '#f9d423');
                updateLocalHUD();
                syncPlayerStats();
            }
        }

        if (!n.hit) {
            const timeDiff = n.targetTime - now;
            const headY = pTargetY - (timeDiff * playerSpeed) - tileH;

            if (timeDiff < -0.18 && !n.missed && !n.holding) {
                n.missed = true;
                playerCombo = 0;
                triggerFeedback('MISS', '#ff2a55');
                SFX.miss();
                updateLocalHUD();
                syncPlayerStats();
            }

            const x = n.lane * laneWidth + 5;
            const width = laneWidth - 10;

            if (!n.isHold) {
                if (headY + tileH > 0 && headY < pH) {
                    const grad = pCtx.createLinearGradient(x, headY, x, headY + tileH);
                    grad.addColorStop(0, '#00f0ff');
                    grad.addColorStop(1, '#3a7bd5');
                    pCtx.fillStyle = grad;
                    pCtx.beginPath();
                    pCtx.roundRect(x, headY, width, tileH, 8);
                    pCtx.fill();
                }
            } else {
                const tailLength = n.durationSec * playerSpeed;
                const tailTopY = headY - tailLength;

                if (headY + tileH > 0 && tailTopY < pH) {
                    pCtx.fillStyle = 'rgba(249, 212, 35, 0.35)';
                    pCtx.fillRect(x + width * 0.25, Math.max(tailTopY, 0), width * 0.5, headY - Math.max(tailTopY, 0) + tileH / 2);

                    const headGrad = pCtx.createLinearGradient(x, headY, x, headY + tileH);
                    headGrad.addColorStop(0, '#f9d423');
                    headGrad.addColorStop(1, '#ff416c');
                    pCtx.fillStyle = headGrad;
                    pCtx.beginPath();
                    pCtx.roundRect(x, headY, width, tileH, 8);
                    pCtx.fill();
                }
            }
        }
    }

    if (now >= 235 || (audioEl.duration && now >= audioEl.duration - 1)) {
        finishMatch();
        return;
    }

    requestAnimationFrame(gameLoop);
}

function finishMatch() {
    gameState = 'GAMEOVER';
    audioEl.pause();
    document.getElementById('gameover-screen').classList.remove('hidden');

    let won = playerScore > rivalScore;
    let tie = playerScore === rivalScore;
    const winnerEl = document.getElementById('winner-announcement');

    if (tie) {
        winnerEl.innerText = "¡EMPATE TÉCNICO!";
    } else {
        winnerEl.innerText = won ? `👑 ¡GANASTE, ${localPlayer.toUpperCase()}!` : `👑 ¡GANÓ ${rivalPlayer.toUpperCase()}!`;
    }

    document.getElementById('final-stats').innerHTML = `
        <b>Tus Puntos:</b> ${playerScore}<br>
        <b>Puntos de ${rivalPlayer}:</b> ${rivalScore}
    `;
}

/* =================================================================
   11. GESTIÓN TÁCTIL (Solo en Canvas Inferior)
   ================================================================= */
function syncTouchLanes(e) {
    e.preventDefault();
    const rect = pCanvas.getBoundingClientRect();
    const newLanes = new Set();

    for (let i = 0; i < e.touches.length; i++) {
        let t = e.touches[i];
        let lane = Math.floor((t.clientX - rect.left) / laneWidth);
        if (lane >= 0 && lane < LANES) newLanes.add(lane);
    }

    newLanes.forEach(lane => {
        if (!activeTouches.has(lane)) onLaneDown(lane);
    });

    activeTouches.forEach(lane => {
        if (!newLanes.has(lane)) onLaneUp(lane);
    });

    activeTouches = newLanes;
}

pCanvas.addEventListener('touchstart', syncTouchLanes, { passive: false });
pCanvas.addEventListener('touchmove', syncTouchLanes, { passive: false });
pCanvas.addEventListener('touchend', syncTouchLanes, { passive: false });
pCanvas.addEventListener('touchcancel', syncTouchLanes, { passive: false });

document.getElementById('rematch-btn').addEventListener('click', () => {
    if (currentRoomRef) currentRoomRef.remove();
    location.reload();
});
</script>
